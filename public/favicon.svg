      <stop offset="0%" stop-color="#00D4AA" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D4AA" flood-opacity="0.45" />
