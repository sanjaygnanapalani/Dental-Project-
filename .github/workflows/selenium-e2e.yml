name: Enterprise E2E Selenium Test Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-selenium-tests:
    name: Run Selenium E2E Automation Suites
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node.js Dependencies
        run: npm ci || npm install

      - name: 4. Install Google Chrome Browser
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 5. Install Firefox Browser
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: 6. Build / Start React Application in Background
        run: |
          npm run build
          npx serve -s dist -l 5173 &
          sleep 5

      - name: 7. Run Selenium Headless E2E Test Suite
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          ENV: "local"
          LOCAL_URL: "http://localhost:5173"
        run: npm run test:headless

      - name: 8. Upload Excel & HTML Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-reports-${{ matrix.browser }}
          path: |
            excel/E2E_Report.xlsx
            reports/
            logs/
            screenshots/
          retention-days: 30
