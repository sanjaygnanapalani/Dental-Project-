name: Grafana k6 Baseline Load Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  k6-baseline-load-test:
    name: Run k6 Baseline Load Testing Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pillow numpy torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: 4. Launch Backend REST API in Background
        run: |
          python backend/app.py &
          npx wait-on http://localhost:5000/api/health --timeout 60000

      - name: 5. Install Grafana k6
        run: |
          sudo gpg -k || true
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 6. Execute Grafana k6 Baseline Load Test (100 VUs, 1 min)
        env:
          API_URL: "http://localhost:5000"
        run: k6 run load-tests/scenarios/baselineLoadTest.js

      - name: 7. Upload Load Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-reports
          path: |
            load-tests/reports/load_test_report.html
            load-tests/reports/load_test_summary.json
          retention-days: 30
