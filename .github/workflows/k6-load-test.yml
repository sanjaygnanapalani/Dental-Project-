name: Grafana k6 Baseline Load Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  k6-baseline-load-test:
    name: Run k6 Baseline Load Testing Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pillow numpy torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: 4. Launch Backend REST API in Background
        run: |
          python backend/app.py &
          npx wait-on http://localhost:5000/api/health --timeout 60000

      - name: 5. Execute Grafana k6 Baseline Load Test (100 VUs, 1 min)
        uses: grafana/k6-action@v0.5.0
        with:
          filename: load-tests/scenarios/baselineLoadTest.js
        env:
          API_URL: "http://localhost:5000"

      - name: 6. Upload Load Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-reports
          path: |
            load-tests/reports/load_test_report.html
            load-tests/reports/load_test_summary.json
          retention-days: 30
